name: Android — testes e APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Testar e compilar
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Baixar código
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Configurar Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      # Ubuntu 24.04 already includes the SDK and accepted Android licenses.
      # Keep its installed command-line tools instead of downgrading them.
      - name: Verificar SDK Android da aplicação
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?Android SDK não encontrado no runner}"
          if [[ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" || ! -x "$ANDROID_HOME/build-tools/35.0.0/aapt2" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
          fi
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt2"

      - name: Configurar Gradle e validar wrapper
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Executar testes, análise estática e gerar APK
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Disponibilizar APK de teste
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: CF-Prova-Android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Disponibilizar relatórios
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: CF-Prova-relatorios
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/*.xml
            app/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 14
